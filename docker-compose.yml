# Local development: `docker compose up --build`, then open http://localhost:5173
# Startup order: db (healthy) → migrate (finished) → api. auth and web start right away.
name: proxylog

x-backend: &backend
  build: { context: ./backend, target: dev }
  volumes:
    - ./backend:/app # your edits show up live (Flask auto-reloads)
    - ./samples:/samples:ro # sample logs, used by the parser tests
    - ./docs:/docs:ro # docs/RESULTS.md is checked against a fresh evaluation
  environment:
    DATABASE_URL: postgresql://proxylog:${POSTGRES_PASSWORD:-local-dev-password}@db:5432/proxylog
    TEST_DATABASE_URL: postgresql://proxylog:${POSTGRES_PASSWORD:-local-dev-password}@db:5432/proxylog_test
    FIREBASE_PROJECT_ID: demo-proxylog
    # Inside the compose network the emulator is "auth", not "localhost".
    FIREBASE_AUTH_EMULATOR_HOST: auth:9099

services:
  db:
    image: postgres:18 # same major version as Neon in production
    environment:
      POSTGRES_USER: proxylog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
      POSTGRES_DB: proxylog
    # Mac port 5433 → container port 5432 (5433 so it can't clash with a Postgres installed on
    # your Mac). Bound to 127.0.0.1: reachable from your Mac only, not your network.
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      # Named volume: data survives restarts. Postgres 18 images keep data under
      # /var/lib/postgresql/18/…, so the volume mounts one level up (a new volume name, so an
      # old Postgres 17 volume is never mixed in).
      - pgdata18:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxylog -d proxylog"]
      interval: 2s
      timeout: 3s
      retries: 30

  auth:
    build: ./infra/auth-emulator
    ports:
      - "127.0.0.1:9099:9099" # the browser talks to the emulator here
      - "127.0.0.1:4000:4000" # emulator UI: view/add fake users

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *backend
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      auth: { condition: service_started }

  web:
    image: node:24-slim
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      API_PROXY_TARGET: http://api:8080
      SAMPLES_DIR: /samples
    ports: ["127.0.0.1:5173:5173"]
    volumes:
      - ./frontend:/app
      - ./samples:/samples:ro   # for the "Try a sample" buttons
      # Linux node_modules stay inside Docker, separate from any on your Mac.
      - web_node_modules:/app/node_modules
    depends_on: [api]

volumes:
  pgdata18:
  web_node_modules:
